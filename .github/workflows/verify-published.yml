name: Verify Published NuGet Packages
on:
  workflow_dispatch:
    inputs:
      version:
        description: Published package version to verify
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        framework: [net8.0, net10.0]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Verify clean registry installation and event delivery
        env:
          VERSION: ${{ inputs.version }}
          SMOKE_TFM: ${{ matrix.framework }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          make smoke-published VERSION="$VERSION" SMOKE_TFM="$SMOKE_TFM"
